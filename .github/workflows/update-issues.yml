name: Update Issues
on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch issues from Google Sheets
        run: python3 fetch_issues_ci.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add issues.json
          git diff --staged --quiet || (git commit -m "Update issues $(date -u +'%Y-%m-%d %H:%M UTC')" && git push)
