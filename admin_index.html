<!-- Vaad Bayit — Admin web app front-end. Paste into an HTML file named "Index" in the
     "Vaad — Admin" Apps Script project (see setup notes in apps_script_admin.js). -->
<!-- Every google.script.run call goes through run_() so a server-side error surfaces as an
     alert instead of leaving the caller's "טוען..." placeholder stuck forever with no feedback. -->
<meta charset="utf-8">
<style>
  :root{
    --bg:#f0f4f8;--surface:#fff;--surface2:#f5f7fa;--border:#dde3ed;
    --text:#1e293b;--muted:#64748b;--primary:#1a3a5c;--accent:#2563eb;
    --green:#15803d;--orange:#b45309;--red:#b91c1c;
    --green-bg:#dcfce7;--orange-bg:#fef3c7;--red-bg:#fee2e2;
    --radius:10px;--font:'Segoe UI','Arial Hebrew',Arial,sans-serif;
  }
  *{box-sizing:border-box}
  /* direction:rtl lives on header/.tabs/main individually, NOT on body/html — keeping the
     document root's own direction at the default ltr puts the page's own scrollbar on the
     natural right-hand side; putting rtl on body instead pushes browsers to render it on
     the left, which read as "wrong side" to Oren/Michael. */
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px}
  header{background:var(--primary);color:#fff;padding:14px 16px;font-weight:700;font-size:18px;position:sticky;top:0;z-index:10;direction:rtl}
  .tabs{display:flex;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:48px;z-index:9;direction:rtl}
  .tab{flex:1;text-align:center;padding:12px 4px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:3px solid transparent}
  .tab.active{color:var(--accent);border-color:var(--accent)}
  main{padding:14px;max-width:640px;margin:0 auto;direction:rtl}
  main.wide{max-width:1400px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px}
  .row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
  .muted{color:var(--muted);font-size:13px}
  input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:8px;font-size:15px;font-family:inherit;background:var(--surface2);color:var(--text)}
  label{font-size:13px;color:var(--muted);display:block;margin-bottom:3px;margin-top:8px}
  button{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:10px 14px;font-size:14px;font-weight:600;cursor:pointer}
  button.secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
  button.small{padding:6px 10px;font-size:13px}
  .badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:600}
  .badge-green{background:var(--green-bg);color:var(--green)}
  .badge-orange{background:var(--orange-bg);color:var(--orange)}
  .badge-red{background:var(--red-bg);color:var(--red)}
  .badge-grey{background:var(--surface2);color:var(--muted)}
  .prog-bar{height:8px;background:var(--surface2);border-radius:6px;overflow:hidden;margin:8px 0}
  .prog-fill{height:100%;background:var(--green)}
  .switch{position:relative;display:inline-block;width:44px;height:24px;flex:none}
  .switch input{opacity:0;width:0;height:0}
  .slider{position:absolute;inset:0;background:#cbd5e1;border-radius:24px;cursor:pointer;transition:.2s}
  .slider:before{content:"";position:absolute;height:18px;width:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
  input:checked + .slider{background:var(--green)}
  input:checked + .slider:before{transform:translateX(-20px)}
  .dash-frame{width:100%;height:1600px;border:1px solid var(--border);border-radius:var(--radius);margin-top:12px;background:#fff}
  .empty{text-align:center;color:var(--muted);padding:30px 0}
  .loading{text-align:center;color:var(--muted);padding:20px 0}
  h3{margin:0 0 4px}
  .subhead{font-size:11px;font-weight:700;color:var(--muted);margin:8px 0 4px;text-transform:uppercase;letter-spacing:.02em}
  .field-row{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-bottom:4px}
  .field-row .k{color:var(--muted)}
  .field-row .v{font-weight:600}
  .cat-pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;background:var(--surface2);color:var(--primary);margin-right:6px}
  .cat-elev{background:#f1e8fd;color:#6d28d9}
  .cat-power{background:var(--orange-bg);color:var(--orange)}
  .cat-telecom{background:#e3f7f4;color:#0f766e}
  .cat-ins{background:#fce7f3;color:#be185d}
  .cat-bank{background:#e7ebf0;color:#475569}
  .cat-other{background:#f0eeec;color:#78716c}
  .section-divider{border-top:1px solid var(--border);margin:8px 0}
  .supplier-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;align-items:stretch}
  .supplier-grid .card{margin-bottom:0;display:flex;flex-direction:column}
  .card-actions{margin-top:auto;padding-top:8px}
  .qd-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
  .qd-chip{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:5px 12px;font-size:13px;display:flex;gap:6px;align-items:center}
  .qd-chip a{color:var(--accent);text-decoration:none}
  .activity-box{background:var(--surface2);border-radius:8px;padding:8px 10px;margin-bottom:6px}
  .activity-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .name{font-weight:600}
  .modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:1000;display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow-y:auto}
  .modal-box{background:var(--surface);border-radius:var(--radius);padding:20px;max-width:480px;width:100%;position:relative;direction:rtl}
  .modal-close{position:absolute;top:10px;left:10px;background:none;border:none;font-size:20px;line-height:1;cursor:pointer;color:var(--muted);padding:4px}
</style>

<header>🏢 ועד בית עמק השלום — ניהול</header>
<div class="tabs">
  <div class="tab active" data-tab="dash" onclick="showTab('dash')">דשבורד</div>
  <div class="tab" data-tab="bank" onclick="showTab('bank')">תנועות בנק</div>
  <div class="tab" data-tab="charges" onclick="showTab('charges')">גביות</div>
  <div class="tab" data-tab="calls" onclick="showTab('calls')">קריאות</div>
  <div class="tab" data-tab="anns" onclick="showTab('anns')">הודעות</div>
  <div class="tab" data-tab="tenants" onclick="showTab('tenants')">כרטיסי דיירים</div>
  <div class="tab" data-tab="suppliers" onclick="showTab('suppliers')">כרטיסי ספקים</div>
</div>
<main class="wide">
  <div id="tab-dash"></div>
  <div id="tab-bank" style="display:none"></div>
  <div id="tab-charges" style="display:none"></div>
  <div id="tab-calls" style="display:none"></div>
  <div id="tab-anns" style="display:none"></div>
  <div id="tab-tenants" style="display:none"></div>
  <div id="tab-suppliers" style="display:none"></div>
</main>

<div id="supplier-modal-backdrop" class="modal-backdrop" style="display:none" onclick="if(event.target===this) closeSupplierModal()">
  <div class="modal-box" id="supplier-modal-content"></div>
</div>

<script>
var DASHBOARD_URL = 'https://emeqhashalom84-jpg.github.io/Vaad-bayit/';

// Wraps google.script.run so a server-side error alerts with the real message instead of
// leaving whatever placeholder ("טוען...") the caller showed stuck forever with no feedback.
function gsError_(err) { alert('שגיאה בשרת: ' + (err && err.message ? err.message : err)); }
function run_(successHandler) { return google.script.run.withSuccessHandler(successHandler).withFailureHandler(gsError_); }

function showTab(name) {
  ['dash','bank','charges','calls','anns','tenants','suppliers'].forEach(function(t){
    document.getElementById('tab-'+t).style.display = (t===name) ? '' : 'none';
    document.querySelector('.tab[data-tab="'+t+'"]').classList.toggle('active', t===name);
  });
  document.querySelector('main').classList.toggle('wide', name === 'dash' || name === 'suppliers' || name === 'bank');
  if (name === 'dash') loadDashboard();
  // bank: NOT reloaded on every tab switch — loadBankTab() wipes the review table, so
  // switching away and back used to lose an in-progress PDF review entirely (real
  // complaint, 2026-09-10, especially painful given the OCR parse itself can be slow).
  // Only the first visit initializes it; later visits just re-show the existing DOM.
  if (name === 'bank' && !bankTabLoaded) { bankTabLoaded = true; loadBankTab(); }
  if (name === 'charges') loadCharges();
  if (name === 'calls') loadCalls();
  if (name === 'anns') loadAnns();
  if (name === 'tenants') loadTenants();
  if (name === 'suppliers') loadSuppliers();
}

/* ───────────────────────── DASHBOARD ───────────────────────── */
// No separate stat strip here — it would just repeat numbers the embedded live
// site already shows in its own KPI cards, from the same source data, sourced
// or computed differently, only risking clashing figures. Just the refresh button + the real thing.
function loadDashboard() {
  var html = '<div class="card" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">' +
    '<button onclick="manualRefresh()">🔄 רענן עכשיו</button>' +
    '<span id="refresh-status" class="muted"></span></div>' +
    '<iframe id="dashFrame" src="'+DASHBOARD_URL+'" class="dash-frame"></iframe>';
  document.getElementById('tab-dash').innerHTML = html;
}

// The embedded dashboard posts its real content height (see the matching listener in
// vaad_bayit_generator.py's generated page) so the iframe can be sized to fit exactly —
// otherwise the iframe gets its own internal scrollbar ON TOP OF the admin page's own
// scrollbar ("page in page", two scrollbars at once).
window.addEventListener('message', function (e) {
  if (e.data && typeof e.data.vaadDashboardHeight === 'number') {
    var f = document.getElementById('dashFrame');
    if (f) f.style.height = Math.max(400, e.data.vaadDashboardHeight + 20) + 'px';
  }
});

function manualRefresh() {
  document.getElementById('refresh-status').textContent = 'מפעיל רענון...';
  run_(function(){
    document.getElementById('refresh-status').textContent = '✓ הופעל — יעדכן את האתר החי בעוד כ-1-2 דקות';
  }).withFailureHandler(function(err){
    document.getElementById('refresh-status').textContent = '✗ שגיאה: '+err.message;
  }).manualRefreshAll();
}

/* ───────────────────────── BANK STATEMENT PDF IMPORT ───────────────────────── */
// Rows are held here between parse and save so the review table can be edited (checkbox,
// name/supplier choice, "אחר" free text) without re-parsing the PDF each time.
var bankReviewRows = [], bankTenantNames = [], bankSupplierNames = [], bankTabLoaded = false;

function loadBankTab() {
  document.getElementById('tab-bank').innerHTML =
    '<div class="card"><h3>ייבוא תנועות בנק מ-PDF</h3>' +
    '<div id="bank-last-row" class="muted">בודק את השורה האחרונה בגיליון...</div>' +
    '<p class="muted" style="margin-top:8px">העלה PDF של תנועות חשבון מהבנק — המערכת תקרא אותו ותציע טבלה לבדיקה לפני שמירה, שום דבר לא נכתב לגיליון אוטומטית.</p>' +
    '<input type="file" id="bank-pdf-input" accept="application/pdf" onchange="onBankPdfSelected(this.files[0])">' +
    '<div id="bank-upload-status" class="muted" style="margin-top:8px"></div>' +
    '</div>' +
    '<div class="card"><h3>ניקוי חד-פעמי: יישור תקבולי דיירים</h3>' +
    '<p class="muted">שורות היסטוריות שהוזנו חודש-חודש (לפני שהייתה לוגיקת ההפצה) יכולות להראות חודש כ"חלקי" גם אם חודש מאוחר יותר כיסה את ההפרש. הכלי הזה מפיץ מחדש את הסה"כ בפועל של כל דייר על פני ינואר-דצמבר — בלי להוסיף כסף חדש, רק לסדר. תצוגה מקדימה לפני כל שינוי.</p>' +
    '<button onclick="previewNormalize_()">🔍 הצג מה ישתנה</button>' +
    '<div id="normalize-preview-container"></div>' +
    '</div>' +
    '<div id="bank-review-container"></div>';
  run_(function (last) {
    var el = document.getElementById('bank-last-row');
    if (!last) { el.textContent = 'אין עדיין תנועות בגיליון.'; return; }
    el.innerHTML = 'הגיליון מסונכרן עד: <strong>' + esc(last.date) + '</strong> — ' +
      esc(last.action) + (last.name ? ' (' + esc(last.name) + ')' : '') +
      ' — יתרה: <strong>' + esc(last.balance) + '</strong>. כל מה שאחרי התאריך הזה ב-PDF הוא חדש.';
  }).getLastBankRow();
}

var bankParseTimer = null;

// A real elapsed-time counter, not a fake progress bar — the OCR conversion has no reportable
// percentage, but an honest "still running, Ns so far" beats a static "a few seconds" message
// that starts looking broken/stuck once it runs past what it promised (real complaint,
// 2026-09-10 — Oren couldn't tell if a slow parse was still working or actually hung).
function startBankParseTimer_() {
  var start = Date.now();
  var el = document.getElementById('bank-upload-status');
  bankParseTimer = setInterval(function () {
    el.textContent = 'מפרסר... (' + Math.round((Date.now() - start) / 1000) + ' שניות. אם זה נמשך כמה דקות, ' +
      'בדוק ב-Apps Script → Executions אם יש שגיאת הרשאות)';
  }, 1000);
}
function stopBankParseTimer_() {
  if (bankParseTimer) { clearInterval(bankParseTimer); bankParseTimer = null; }
}

function onBankPdfSelected(file) {
  if (!file) return;
  document.getElementById('bank-upload-status').textContent = 'קורא את הקובץ...';
  var reader = new FileReader();
  reader.onload = function () {
    // reader.result is "data:application/pdf;base64,<data>" — strip the prefix
    var base64 = reader.result.split(',')[1];
    startBankParseTimer_();
    run_(function (rows) {
      stopBankParseTimer_();
      // Real bug caught 2026-09-10: the server call completes successfully (confirmed via
      // Apps Script's own Executions log, ~6s every time) but the response can still arrive
      // as null on the client — an Apps Script serialization issue, not a crash in the OCR
      // or parsing. Without this check it threw "Cannot read properties of null (reading
      // 'map')" with no useful message, looking exactly like an infinite hang.
      if (!rows) {
        document.getElementById('bank-upload-status').textContent =
          '✗ השרת סיים אך לא החזיר נתונים תקינים (בעיית תקשורת) — נסה קובץ קטן יותר, או שוב בעוד רגע.';
        return;
      }
      bankReviewRows = rows.map(function (r, i) {
        r.id = i;
        r.include = !r.isDuplicate; // new rows checked by default, suspected-existing unchecked
        // For duplicates, show what's already recorded (context only — never sent back on
        // save, since these rows stay unchecked) instead of the usual recommendation.
        r.name = r.isDuplicate ? (r.existingName || '') : (r.recommendedName || '');
        r.note = r.isDuplicate ? (r.existingNote || '') : '';
        r.nameOther = '';
        r.distribute = true; // credit rows tagged with a tenant auto-update תקבולי דיירים by
        // default — uncheck for a credit that isn't a regular monthly payment (e.g. an old-
        // debt/2025 settlement happens to be tagged with a tenant's name).
        return r;
      });
      document.getElementById('bank-upload-status').textContent =
        '✓ נמצאו ' + rows.length + ' תנועות';
      run_(function (names) {
        bankTenantNames = names;
        run_(function (snames) {
          bankSupplierNames = snames;
          renderBankReviewTable();
        }).getSupplierNames();
      }).getTenantNames();
    }).withFailureHandler(function (err) {
      stopBankParseTimer_();
      document.getElementById('bank-upload-status').textContent = '✗ שגיאה: ' + err.message;
    }).parseBankStatementPdf(base64, file.name);
  };
  reader.readAsDataURL(file);
}

function renderBankReviewTable() {
  if (!bankReviewRows.length) {
    document.getElementById('bank-review-container').innerHTML = '';
    return;
  }
  var html = '<div class="card"><h3>בדיקה לפני שמירה</h3>' +
    '<p class="muted">שורות מסומנות "כבר קיים בגיליון" לא ייבחרו כברירת מחדל — אפשר לסמן אותן ידנית אם ההתאמה האוטומטית שגויה.</p>' +
    '<div class="tbl-wrap"><table><thead><tr>' +
    '<th></th><th>תאריך</th><th>פעולה</th><th>סכום</th><th>יתרה</th><th>סוג</th><th>שם דייר/ספק</th><th>עבור</th><th>עדכן תקבולי דיירים</th>' +
    '</tr></thead><tbody>';
  bankReviewRows.forEach(function (r) {
    var dupNote = r.isDuplicate ? ' <span class="muted">(כבר קיים בגיליון)</span>' : '';
    html += '<tr' + (r.isDuplicate ? ' style="opacity:0.6;background:var(--surface2)"' : '') + '>' +
      '<td><input type="checkbox" ' + (r.include ? 'checked' : '') + ' onchange="bankReviewRows[' + r.id + '].include=this.checked; renderBankReviewTable()"></td>' +
      '<td style="white-space:nowrap">' + esc(r.date) + '</td>' +
      '<td>' + esc(r.action) + dupNote + '</td>' +
      '<td style="white-space:nowrap">₪' + r.amount.toLocaleString() + '</td>' +
      '<td style="white-space:nowrap">₪' + r.balance.toLocaleString() + '</td>' +
      '<td style="white-space:nowrap"><select style="color:' + (r.isCredit ? '#16a34a' : '#dc2626') + ';font-weight:600" ' +
      'onchange="bankReviewRows[' + r.id + '].isCredit=(this.value===\'credit\'); renderBankReviewTable()">' +
      '<option value="credit" ' + (r.isCredit ? 'selected' : '') + '>הכנסה</option>' +
      '<option value="debit" ' + (!r.isCredit ? 'selected' : '') + '>הוצאה</option></select></td>' +
      '<td>' + bankNameCellHtml_(r) + '</td>' +
      '<td><input type="text" placeholder="עבור (אופציונלי)" value="' + esc(r.note || '') + '" style="width:100%" ' +
      'oninput="bankReviewRows[' + r.id + '].note=this.value"></td>' +
      '<td style="text-align:center">' + (r.isCredit && r.include ? bankDistributeCellHtml_(r) : '<span class="muted">—</span>') +
      '</td></tr>';
  });
  html += '</tbody></table></div>' +
    '<button style="margin-top:10px" onclick="saveBankRows()">💾 שמור את השורות המסומנות</button>' +
    '<span id="bank-save-status" class="muted" style="margin-right:10px"></span>' +
    '</div>';
  document.getElementById('bank-review-container').innerHTML = html;
}

// Credit rows get a tenant-name dropdown, debit rows a supplier dropdown — both with "אחר"
// revealing a free-text box, per Oren's spec.
// Same household-name-matching idea as _name_match in vaad_bayit_generator.py: the sheet's
// own history (used for the recommendation) and the official tenant-card display names are
// two independently-maintained lists, so a recommended name like "עמרי ושיר יוסוב" needs to
// match its dropdown option even if it isn't byte-for-byte identical (extra/missing spaces,
// slightly different word order). Splits on whitespace, strips a leading Hebrew "ו" from each
// word, matches if any word is shared. Without this, a perfectly good recommendation silently
// falls through to the "אחר" free-text box instead of landing pre-selected in the dropdown.
function fuzzyNameMatch_(a, b) {
  function toks(s) { return String(s || '').split(/\s+/).map(function (w) { return w[0] === 'ו' && w.length > 1 ? w.slice(1) : w; }).filter(Boolean); }
  var ta = toks(a), tb = toks(b);
  return ta.some(function (w) { return tb.indexOf(w) !== -1; });
}
function bankNameCellHtml_(r) {
  var options = r.isCredit ? bankTenantNames : bankSupplierNames;
  // Canonicalize once: if r.name fuzzy-matches an option, use the option's exact string so
  // both the dropdown selection and the value actually saved are the real, official name.
  if (r.name && r.name !== '__other__' && options.indexOf(r.name) === -1) {
    var match = options.find(function (n) { return fuzzyNameMatch_(r.name, n); });
    if (match) r.name = match;
  }
  var html = '<select onchange="onBankNameChange_(' + r.id + ', this.value)">' +
    '<option value="">— בחר —</option>';
  options.forEach(function (n) {
    html += '<option value="' + esc(n) + '" ' + (r.name === n ? 'selected' : '') + '>' + esc(n) + '</option>';
  });
  var isOther = r.name === '__other__' || (r.name && options.indexOf(r.name) === -1 && r.name !== '');
  html += '<option value="__other__" ' + (isOther ? 'selected' : '') + '>אחר...</option></select>';
  if (isOther) {
    html += '<input type="text" placeholder="שם" value="' + esc(r.name === '__other__' ? '' : r.name) + '" ' +
      'style="margin-top:4px" oninput="bankReviewRows[' + r.id + '].name=this.value">';
  }
  return html;
}
function onBankNameChange_(id, value) {
  bankReviewRows[id].name = value;
  renderBankReviewTable();
}

// Small checkbox + "edit amount" button instead of a permanent extra column — the split
// (some of a payment going toward old 2025 carryover instead of 2026 dues) is a rare,
// judgment-based override, not something every row needs visible. Reuses the same modal
// already built for supplier editing (openSupplierModal_/closeSupplierModal), just with
// different content — one popup element on the page is enough since only one is ever open.
function bankDistributeCellHtml_(r) {
  var full = (r.distributeAmount === undefined || r.distributeAmount === null);
  var label = full ? '' : ' (₪' + r.distributeAmount.toLocaleString() + ' מתוך ₪' + r.amount.toLocaleString() + ')';
  return '<input type="checkbox" ' + (r.distribute ? 'checked' : '') +
    ' title="בטל אם זו לא הכנסה חודשית רגילה (למשל סילוק חוב ישן)" ' +
    'onchange="bankReviewRows[' + r.id + '].distribute=this.checked; renderBankReviewTable()">' +
    (r.distribute ? ' <button class="small secondary" style="font-size:11px" onclick="openBankSplitModal_(' + r.id + ')">✎ סכום' + label + '</button>' : '');
}

// Redesigned per Oren (2026-09-10): instead of typing the amount TO distribute directly, type
// how much goes to the OLD 2025 carryover debt — the rest is computed automatically and is
// what actually gets distributed into 2026 months. Saving also deducts the carryover amount
// from "חוב מועבר" for that tenant (e.g. 1520 - 520 = 1000), not just a manual reminder.
function openBankSplitModal_(id) {
  var r = bankReviewRows[id];
  var carry = r.carryoverAmount || 0;
  openSupplierModal_(
    '<h3>חלוקת התשלום</h3>' +
    '<p class="muted">סכום התנועה הכולל: <strong>₪' + r.amount.toLocaleString() + '</strong>. ' +
    'אם חלק מהתשלום מכוסה כנגד חוב מועבר מ-2025 — הכנס כאן כמה. השאר יופץ אוטומטית לחודשי 2026, ' +
    'והסכום שהכנסת יופחת אוטומטית מ"חוב מועבר" עבור הדייר.</p>' +
    '<label>סכום לחוב מועבר:</label>' +
    '<input type="number" id="bank-split-input" value="' + carry + '" style="width:100%" oninput="updateBankSplitPreview_(' + r.amount + ')">' +
    '<p style="margin-top:8px">יופץ לתקבולי דיירים 2026: <strong id="bank-split-preview">₪' + (r.amount - carry).toLocaleString() + '</strong></p>' +
    '<div style="margin-top:10px;display:flex;gap:8px">' +
    '<button onclick="saveBankSplit_(' + id + ')">אישור</button>' +
    '<button class="secondary" onclick="bankReviewRows[' + id + '].carryoverAmount=0; closeSupplierModal(); renderBankReviewTable()">איפוס (הכל ל-2026)</button>' +
    '</div>'
  );
}
function updateBankSplitPreview_(total) {
  var v = Number(document.getElementById('bank-split-input').value) || 0;
  document.getElementById('bank-split-preview').textContent = '₪' + Math.max(0, total - v).toLocaleString();
}
function saveBankSplit_(id) {
  var r = bankReviewRows[id];
  var v = Number(document.getElementById('bank-split-input').value);
  if (!isFinite(v) || v < 0 || v > r.amount) { alert('סכום לא תקין'); return; }
  r.carryoverAmount = v;
  r.distributeAmount = r.amount - v;
  closeSupplierModal();
  renderBankReviewTable();
}

function saveBankRows() {
  var toSave = bankReviewRows.filter(function (r) { return r.include; })
    .map(function (r) { return { date: r.date, name: r.name === '__other__' ? '' : r.name, action: r.action, amount: r.amount, isCredit: r.isCredit, balance: r.balance, note: r.note || '', distribute: !!r.distribute, distributeAmount: (r.distributeAmount === undefined || r.distributeAmount === null) ? r.amount : r.distributeAmount, carryoverAmount: r.carryoverAmount || 0 }; });
  if (!toSave.length) { alert('לא סומנו שורות לשמירה'); return; }
  var distCount = toSave.filter(function (r) { return r.isCredit && r.name && r.distribute; }).length;
  var carryTotal = toSave.reduce(function (s, r) { return s + (r.carryoverAmount || 0); }, 0);
  var msg = 'לשמור ' + toSave.length + ' תנועות לגיליון "תנועות בנק"?';
  if (distCount) msg += '\n(' + distCount + ' מהן יעדכנו גם את תקבולי דיירים בהתאם)';
  if (carryTotal) msg += '\n(סה"כ ₪' + carryTotal.toLocaleString() + ' יקוזזו מ"חוב מועבר")';
  if (!confirm(msg)) return;
  document.getElementById('bank-save-status').textContent = 'שומר...';
  run_(function () {
    document.getElementById('bank-save-status').textContent = '✓ נשמר';
    bankReviewRows = bankReviewRows.filter(function (r) { return !r.include; });
    renderBankReviewTable();
  }).withFailureHandler(function (err) {
    document.getElementById('bank-save-status').textContent = '✗ שגיאה: ' + err.message;
  }).appendBankTransactions(toSave);
}

var MONTHS_HE_ = ['ינו', 'פבר', 'מרץ', 'אפר', 'מאי', 'יונ', 'יול', 'אוג', 'ספט', 'אוק', 'נוב', 'דצמ'];

function previewNormalize_() {
  document.getElementById('normalize-preview-container').innerHTML = '<div class="muted">בודק...</div>';
  run_(function (rows) {
    normalizePreviewRows = rows;
    if (!rows.length) {
      document.getElementById('normalize-preview-container').innerHTML = '<p class="muted">כל השורות כבר מסודרות — אין מה לשנות.</p>';
      return;
    }
    var html = '<div class="tbl-wrap"><table><thead><tr><th></th><th>דייר</th>' +
      MONTHS_HE_.map(function (m) { return '<th>' + m + '</th>'; }).join('') + '</tr></thead><tbody>';
    rows.forEach(function (r, idx) {
      html += '<tr><td rowspan="2" style="vertical-align:middle"><input type="checkbox" id="norm-chk-' + idx + '" checked></td>' +
        '<td>' + esc(r.name) + ' <span class="muted">(לפני)</span></td>' +
        r.oldMonthly.map(function (v) { return '<td>' + (v ? '₪' + v.toLocaleString() : '—') + '</td>'; }).join('') + '</tr>' +
        '<tr><td><strong>' + esc(r.name) + '</strong> <span class="muted">(אחרי)</span></td>' +
        r.newMonthly.map(function (v, i) {
          var changed = Math.abs(v - r.oldMonthly[i]) > 0.001;
          return '<td' + (changed ? ' style="font-weight:700;color:#16a34a"' : '') + '>' + (v ? '₪' + v.toLocaleString() : '—') + '</td>';
        }).join('') + '</tr>';
    });
    html += '</tbody></table></div>' +
      '<button style="margin-top:10px" onclick="applyNormalize_()">✅ בצע את השינויים המסומנים</button>' +
      '<span id="normalize-status" class="muted" style="margin-right:10px"></span>';
    document.getElementById('normalize-preview-container').innerHTML = html;
  }).previewNormalizeAllTenants();
}

function applyNormalize_() {
  var chosen = normalizePreviewRows.filter(function (r, idx) {
    return document.getElementById('norm-chk-' + idx).checked;
  }).map(function (r) { return r.rowIdx; });
  if (!chosen.length) { alert('לא נבחרו שורות'); return; }
  if (!confirm('לבצע יישור על ' + chosen.length + ' דיירים? הפעולה כותבת ישירות לתקבולי דיירים.')) return;
  document.getElementById('normalize-status').textContent = 'מבצע...';
  run_(function () {
    document.getElementById('normalize-status').textContent = '✓ בוצע';
    document.getElementById('normalize-preview-container').innerHTML = '<p class="muted">בוצע.</p>';
  }).withFailureHandler(function (err) {

function ddmmyyyyToIso_(s) {
  var m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(s||'');

  return m[3]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[1]).slice(-2);
}
function isoToDdmmyyyy_(s) {
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');

// Announcements' "date" column accepts Y-M-D (native <input type="date"> / pasted Excel)
// or M/D/Y (the sheet's own Form-locale) — see parseScheduledDate_ in
// apps_script_announcements.js. A native date input always emits Y-M-D, which is already
// the first pattern that parser tries, so no conversion is needed going out; converting
// back in for prefill just needs to handle both possible existing formats.
function annDateToIso_(s) {
  s = (s||'').trim();
  var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s);
  if (m) return m[0];
  m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(s);
  if (m) return m[3]+'-'+('0'+m[1]).slice(-2)+'-'+('0'+m[2]).slice(-2);
  return '';
}

  var vd = String(a.validDays||'');
  var isPreset = ANN_VALID_DAYS_OPTIONS.indexOf(vd) !== -1;
  var isOther = vd && !isPreset;
  var vdOpts = '<option value="">ללא הגבלה</option>' +
    ANN_VALID_DAYS_OPTIONS.map(function(d){ return '<option value="'+d+'"'+(d===vd?' selected':'')+'>'+d+'</option>'; }).join('') +
    '<option value="other"'+(isOther?' selected':'')+'>אחר</option>';

    '<label>תאריך תחילה (ריק = מיידי)</label><input type="date" id="'+id+'-date" value="'+annDateToIso_(a.date)+'">' +
    '<label>תוקף (ימים)</label><select id="'+id+'-validdays" onchange="onAnnValidDaysChange_(\''+id+'\')">'+vdOpts+'</select>' +
    '<input id="'+id+'-validdays-other" type="number" style="margin-top:6px" placeholder="מספר ימים" value="'+(isOther?esc(vd):'')+'"'+(isOther?'':' hidden')+'>' +

/* ───────────────────────── SUPPLIERS ───────────────────────── */
var currentSuppliers = [];
var SUPPLIER_CATS = ['חשמל','מעליות','תקשורת','ביטוח','בנק','ניקיון','גינון','אחר'];
var REMINDER_TYPES = ['הוראת קבע','תשלום','תפוגת חוזה','תפוגת פוליסה','אחר'];
var REMINDER_FREQS = ['חד-פעמי','חודשי','רבעוני','חצי שנתי','שנתי','אחר'];

function loadSuppliers() {
  document.getElementById('tab-suppliers').innerHTML = '<div class="loading">טוען...</div>';
  run_(renderSuppliers).getSuppliers();
}

// Editing opens in a centered popup instead of expanding inline inside the (narrow, grid-
// column-width) card — the full form with custom fields + reminders didn't fit legibly
// squeezed into one grid cell.
var supplierModalOpen = false;
function openSupplierModal_(innerHtml) {
  supplierModalOpen = true;
  document.getElementById('supplier-modal-content').innerHTML = '<button class="modal-close" onclick="closeSupplierModal()">✕</button>' + innerHtml;
  document.getElementById('supplier-modal-backdrop').style.display = 'flex';
}
function closeSupplierModal() {
  supplierModalOpen = false;
  document.getElementById('supplier-modal-backdrop').style.display = 'none';
}
// A field/reminder save's server response can arrive AFTER the modal was already closed
// (e.g. clicked ✕ right after clicking 💾) — without this guard, that response's own
// "refresh the modal" step would silently reopen it, so ✕ looked like it needed a second
// click to actually stick.
function refreshSupplierModalIfOpen_(list, rowNum) {
  renderSuppliers(list);
  if (supplierModalOpen) showEditSupplierForm(rowNum);
}

function badgeClass_(status) {
  return status === 'late' ? 'badge-red' : (status === 'soon' ? 'badge-orange' : 'badge-green');
}
function catClass_(category) {
  var map = { 'מעליות': 'cat-elev', 'חשמל': 'cat-power', 'תקשורת': 'cat-telecom', 'ביטוח': 'cat-ins', 'בנק': 'cat-bank' };
  return map[category] || 'cat-other';
}

// Wrapped in try/catch — a rendering bug used to fail completely silently (no alert, no
// visible change), which is exactly what caused 50 duplicate rows: the save was actually
// succeeding every time, but with zero visible confirmation the form looked "stuck", so
// clicking שמור again and again kept re-submitting the same still-filled-in form.
function renderSuppliers(list) {
  try {
    currentSuppliers = list;
    var html = '';
    var quick = list.filter(function (s) { return s.active && s.phone; }).slice(0, 4);
    if (quick.length) {
      html += '<div class="qd-row">' + quick.map(function (s) {
        return '<span class="qd-chip">' + esc(s.name) + ' <a href="tel:' + esc(s.phone.replace(/[^0-9+]/g, '')) + '">' + esc(s.phone) + '</a></span>';
      }).join('') + '</div>';
    }
    html += '<div class="card"><button onclick="showNewSupplierForm()">+ ספק חדש</button></div>';
    html += '<div class="row" style="gap:10px;margin-bottom:12px">' +
      '<input id="supplier-search" placeholder="חיפוש לפי שם, קטגוריה או טלפון…" oninput="filterSuppliers()" style="flex:1">' +
      '<select id="supplier-cat-filter" onchange="filterSuppliers()" style="flex:none;width:auto">' +
      '<option value="">כל הקטגוריות</option>' +
      SUPPLIER_CATS.map(function (c) { return '<option value="' + c + '">' + c + '</option>'; }).join('') +
      '</select></div>';
    var active = list.filter(function (s) { return s.active; });
    var inactive = list.filter(function (s) { return !s.active; });
    if (!active.length && !inactive.length) { html += '<div class="empty">אין ספקים</div>'; document.getElementById('tab-suppliers').innerHTML = html; return; }
    if (active.length) html += '<div class="supplier-grid">' + active.map(supplierCardHtml_).join('') + '</div>';
    if (inactive.length) {
      html += '<div class="subhead" style="margin-top:18px">ספקים לא פעילים</div>';
      html += '<div class="supplier-grid">' + inactive.map(supplierCardHtml_).join('') + '</div>';
    }
    document.getElementById('tab-suppliers').innerHTML = html;
    document.getElementById('supplier-search').value = supplierFilterState.q;
    document.getElementById('supplier-cat-filter').value = supplierFilterState.cat;
    applySupplierFilter_();
  } catch (e) {
    document.getElementById('tab-suppliers').innerHTML = '<div class="empty">שגיאה בתצוגה: ' + esc(e.message) + '</div>';
    alert('שגיאה בהצגת רשימת הספקים: ' + e.message);
  }
}

// Filter state is kept outside the DOM so it survives every re-render (a save re-renders
// the whole tab) instead of the search box silently clearing itself after each action.
var supplierFilterState = { q: '', cat: '' };
function filterSuppliers() {
  supplierFilterState.q = (document.getElementById('supplier-search').value || '').trim().toLowerCase();
  supplierFilterState.cat = document.getElementById('supplier-cat-filter').value;
  applySupplierFilter_();
}
function applySupplierFilter_() {
  var q = supplierFilterState.q, cat = supplierFilterState.cat;
  document.querySelectorAll('#tab-suppliers .supplier-grid .card').forEach(function (card) {
    var name = card.getAttribute('data-sname') || '';
    var scat = card.getAttribute('data-scat') || '';
    var phone = card.getAttribute('data-sphone') || '';
    var matchesQ = !q || name.indexOf(q) !== -1 || scat.indexOf(q) !== -1 || phone.indexOf(q) !== -1;
    var matchesCat = !cat || card.getAttribute('data-scat-raw') === cat;
    card.style.display = (matchesQ && matchesCat) ? '' : 'none';
  });
}

function supplierCardHtml_(s) {
  var h = '<div class="card" data-sname="' + esc((s.name || '').toLowerCase()) + '" data-scat="' + esc((s.category || '').toLowerCase()) + '" data-scat-raw="' + esc(s.category || '') + '" data-sphone="' + esc(s.phone || '') + '">' +
    '<div class="row"><div><span class="name">' + esc(s.name) + '</span>' +
    (s.category ? ' <span class="cat-pill ' + catClass_(s.category) + '">' + esc(s.category) + '</span>' : '') + '</div>' +
    '<label class="switch"><input type="checkbox" ' + (s.active ? 'checked' : '') + ' onchange="toggleSupplierActive_(' + s.rowNum + ', this.checked)"><span class="slider"></span></label></div>';
  if (s.contact) h += '<div class="muted">איש קשר: ' + esc(s.contact) + '</div>';
  if (s.phone) h += '<div class="muted">📞 <a href="tel:' + esc(s.phone.replace(/[^0-9+]/g, '')) + '">' + esc(s.phone) + '</a></div>';
  if (s.phone2) h += '<div class="muted">☎️ קו נוסף: <a href="tel:' + esc(s.phone2.replace(/[^0-9+]/g, '')) + '">' + esc(s.phone2) + '</a></div>';
  if (s.email) h += '<div class="muted">✉️ <a href="mailto:' + esc(s.email) + '">' + esc(s.email) + '</a></div>';
  if (s.notes) h += '<div class="muted">' + esc(s.notes) + '</div>';
  if (s.fields.length) {
    h += '<div class="section-divider"></div><div class="subhead">שדות נוספים</div>';
    h += s.fields.map(function (f) {
      return '<div class="field-row"><span class="k">' + esc(f.label) + '</span><span class="v">' + esc(f.value) + '</span></div>';
    }).join('');
  }
  var activeReminders = s.reminders.filter(function (r) { return r.active; });
  if (activeReminders.length) {
    h += '<div class="section-divider"></div><div class="subhead">תזכורות</div>';
    h += activeReminders.map(function (r) {
      return '<div class="activity-box"><div class="activity-top"><span>' + esc(r.description) + '</span>' +
        '<span class="badge ' + badgeClass_(r.badge.status) + '">' + esc(r.badge.label) + '</span></div>' +
        '<div class="muted" style="font-size:11.5px">' + esc(r.type) + ' · ' + esc(r.frequency) + ' · יעד ' + esc(r.dueDate) + (r.amount ? ' · ₪' + esc(r.amount) : '') + '</div></div>';
    }).join('');
  }
  h += '<div class="row card-actions"><button class="small secondary" onclick="showEditSupplierForm(' + s.rowNum + ')">✏️ ערוך</button>' +
    '<button class="small secondary" onclick="deleteSupplier_(' + s.rowNum + ')">🗑 מחק</button></div>';
  h += '</div>';
  return h;
}

function supplierCoreFormHtml_(id, s) {
  s = s || {};
  return '<div style="margin-top:10px;border-top:1px solid var(--border);padding-top:10px">' +
    '<label>שם ספק</label><input id="' + id + '-name" value="' + esc(s.name || '') + '">' +
    '<label>קטגוריה</label><select id="' + id + '-category"><option value="">—</option>' +

    '<label>איש קשר</label><input id="' + id + '-contact" value="' + esc(s.contact || '') + '">' +
    '<label>טלפון</label><input id="' + id + '-phone" value="' + esc(s.phone || '') + '">' +
    '<label>טלפון נוסף</label><input id="' + id + '-phone2" value="' + esc(s.phone2 || '') + '">' +
    '<label>מייל</label><input id="' + id + '-email" value="' + esc(s.email || '') + '">' +

    '</div>';
}
function supplierCoreFormValues_(id) {
  return {
    name: document.getElementById(id + '-name').value.trim(),
    category: document.getElementById(id + '-category').value,
    contact: document.getElementById(id + '-contact').value.trim(),
    phone: document.getElementById(id + '-phone').value.trim(),
    phone2: document.getElementById(id + '-phone2').value.trim(),
    email: document.getElementById(id + '-email').value.trim(),
    notes: document.getElementById(id + '-notes').value.trim()
  };
}
function showNewSupplierForm() {
  var html = '<h3>ספק חדש</h3>' + supplierCoreFormHtml_('ns', {}) +
    '<button id="ns-submit-btn" style="margin-top:10px" onclick="submitNewSupplier()">שמור</button>';
  openSupplierModal_(html);
}
function submitNewSupplier() {
  var v = supplierCoreFormValues_('ns');
  if (!v.name) { alert('נא למלא שם ספק'); return; }
  var btn = document.getElementById('ns-submit-btn');
  btn.disabled = true; btn.textContent = 'שומר...';
  run_(function (list) { renderSuppliers(list); closeSupplierModal(); }).createSupplier(v.name, v.category, v.contact, v.phone, v.phone2, v.email, v.notes);
}
function toggleSupplierActive_(rowNum, active) {
  run_(renderSuppliers).toggleSupplierActive(rowNum, active);
}
// Deliberate, separate from the active toggle — the toggle only moves a card between the
// active/inactive sections, it never removes it. This is the only action that actually
// deletes the row (and its linked custom fields/reminders), hence the confirm prompt.
function deleteSupplier_(rowNum) {
  var s = currentSuppliers.find(function (x) { return x.rowNum === rowNum; });
  if (!s) return;
  if (!confirm('למחוק לצמיתות את הספק "' + s.name + '"? הפעולה גם תמחק את כל השדות והתזכורות שלו, ולא ניתנת לביטול.')) return;
  run_(renderSuppliers).deleteSupplier(rowNum);
}

function showEditSupplierForm(rowNum) {
  var s = currentSuppliers.find(function (x) { return x.rowNum === rowNum; });
  if (!s) return;
  var id = 'es' + rowNum;
  var html = '<h3>' + esc(s.name) + '</h3>' + supplierCoreFormHtml_(id, s);
  html += '<label style="display:flex;align-items:center;gap:8px;margin-top:8px"><input type="checkbox" id="' + id + '-active" ' + (s.active ? 'checked' : '') + ' style="width:auto"> פעיל</label>';
  html += '<button style="margin-top:8px" onclick="submitEditSupplierCore(' + rowNum + ')">שמור פרטי ספק</button>';

  html += '<div class="subhead" style="margin-top:14px">שדות נוספים</div>';
  html += s.fields.map(function (f) {
    return '<div class="row"><input style="flex:1" id="field-label-' + f.rowNum + '" value="' + esc(f.label) + '" placeholder="תווית">' +
      '<input style="flex:1" id="field-value-' + f.rowNum + '" value="' + esc(f.value) + '" placeholder="ערך">' +
      '<button class="small secondary" onclick="saveSupplierField(' + f.rowNum + ',' + rowNum + ')">💾</button>' +
      '<button class="small secondary" onclick="removeSupplierField(' + f.rowNum + ',' + rowNum + ')">🗑</button></div>';
  }).join('');
  html += '<div class="row"><input style="flex:1" id="' + id + '-newfield-label" placeholder="תווית חדשה">' +
    '<input style="flex:1" id="' + id + '-newfield-value" placeholder="ערך">' +
    '<button class="small secondary" onclick="addSupplierField(\'' + id + '\', ' + rowNum + ')">+ הוסף</button></div>';

  html += '<div class="subhead" style="margin-top:14px">תזכורות</div>';
  html += s.reminders.map(function (r) { return reminderEditRowHtml_(r, rowNum); }).join('');
  html += '<div id="' + id + '-new-reminder"></div>';
  html += '<button class="small secondary" style="margin-top:6px" onclick="showNewReminderForm(\'' + id + '\', ' + rowNum + ')">+ הוסף תזכורת</button>';

  openSupplierModal_(html);
}
function submitEditSupplierCore(rowNum) {
  var id = 'es' + rowNum;
  var v = supplierCoreFormValues_(id);
  if (!v.name) { alert('נא למלא שם ספק'); return; }
  var active = document.getElementById(id + '-active').checked;
  run_(function (list) { refreshSupplierModalIfOpen_(list, rowNum); }).updateSupplier(rowNum, v.name, v.category, v.contact, v.phone, v.phone2, v.email, v.notes, active);
}

function saveSupplierField(fieldRowNum, supplierRowNum) {
  var label = document.getElementById('field-label-' + fieldRowNum).value.trim();
  var value = document.getElementById('field-value-' + fieldRowNum).value.trim();
  run_(function (list) { refreshSupplierModalIfOpen_(list, supplierRowNum); }).updateSupplierField(fieldRowNum, label, value);
}
function removeSupplierField(fieldRowNum, supplierRowNum) {
  run_(function (list) { refreshSupplierModalIfOpen_(list, supplierRowNum); }).deleteSupplierField(fieldRowNum);
}
function addSupplierField(id, supplierRowNum) {
  var label = document.getElementById(id + '-newfield-label').value.trim();
  var value = document.getElementById(id + '-newfield-value').value.trim();
  if (!label) { alert('נא למלא תווית'); return; }
  var s = currentSuppliers.find(function (x) { return x.rowNum === supplierRowNum; });
  run_(function (list) { refreshSupplierModalIfOpen_(list, supplierRowNum); }).createSupplierField(s.name, label, value);
}

function reminderEditRowHtml_(r, supplierRowNum) {
  var id = 'rem' + r.rowNum;
  return '<div class="card" style="padding:10px;margin-bottom:8px">' +
    '<label>סוג</label><select id="' + id + '-type">' + REMINDER_TYPES.map(function (t) { return '<option' + (t === r.type ? ' selected' : '') + '>' + t + '</option>'; }).join('') + '</select>' +
    '<label>תיאור</label><input id="' + id + '-desc" value="' + esc(r.description) + '">' +
    '<label>תדירות</label><select id="' + id + '-freq">' + REMINDER_FREQS.map(function (f) { return '<option' + (f === r.frequency ? ' selected' : '') + '>' + f + '</option>'; }).join('') + '</select>' +
    '<label>תאריך יעד</label><input type="date" id="' + id + '-date" value="' + ddmmyyyyToIso_(r.dueDate) + '">' +
    '<label>סכום</label><input type="number" id="' + id + '-amount" value="' + esc(r.amount) + '">' +
    '<div class="row" style="margin-top:8px">' +
      '<button class="small secondary" onclick="saveSupplierReminder(' + r.rowNum + ',' + supplierRowNum + ')">💾 שמור</button>' +
      '<label class="switch"><input type="checkbox" ' + (r.active ? 'checked' : '') + ' onchange="toggleSupplierReminderActive_(' + r.rowNum + ', this.checked, ' + supplierRowNum + ')"><span class="slider"></span></label>' +
    '</div></div>';
}
function saveSupplierReminder(reminderRowNum, supplierRowNum) {
  var id = 'rem' + reminderRowNum;
  var type = document.getElementById(id + '-type').value;
  var desc = document.getElementById(id + '-desc').value.trim();
  var freq = document.getElementById(id + '-freq').value;
  var date = isoToDdmmyyyy_(document.getElementById(id + '-date').value);
  var amount = document.getElementById(id + '-amount').value;
  run_(function (list) { refreshSupplierModalIfOpen_(list, supplierRowNum); }).updateSupplierReminder(reminderRowNum, type, desc, freq, date, amount);
}
function toggleSupplierReminderActive_(reminderRowNum, active, supplierRowNum) {
  run_(function (list) { refreshSupplierModalIfOpen_(list, supplierRowNum); }).toggleSupplierReminderActive(reminderRowNum, active);
}
function showNewReminderForm(id, supplierRowNum) {
  var html = '<div class="card" style="padding:10px;margin-bottom:8px">' +
    '<label>סוג</label><select id="' + id + '-nr-type">' + REMINDER_TYPES.map(function (t) { return '<option>' + t + '</option>'; }).join('') + '</select>' +
    '<label>תיאור</label><input id="' + id + '-nr-desc">' +
    '<label>תדירות</label><select id="' + id + '-nr-freq">' + REMINDER_FREQS.map(function (f) { return '<option>' + f + '</option>'; }).join('') + '</select>' +
    '<label>תאריך יעד</label><input type="date" id="' + id + '-nr-date">' +
    '<label>סכום</label><input type="number" id="' + id + '-nr-amount">' +
    '<button style="margin-top:8px" onclick="addSupplierReminder(\'' + id + '\', ' + supplierRowNum + ')">שמור תזכורת</button></div>';
  document.getElementById(id + '-new-reminder').innerHTML = html;
}
function addSupplierReminder(id, supplierRowNum) {
  var type = document.getElementById(id + '-nr-type').value;
  var desc = document.getElementById(id + '-nr-desc').value.trim();
  var freq = document.getElementById(id + '-nr-freq').value;
  var date = isoToDdmmyyyy_(document.getElementById(id + '-nr-date').value);
  var amount = document.getElementById(id + '-nr-amount').value;
  if (!desc) { alert('נא למלא תיאור'); return; }
  var s = currentSuppliers.find(function (x) { return x.rowNum === supplierRowNum; });
  run_(function (list) { refreshSupplierModalIfOpen_(list, supplierRowNum); }).createSupplierReminder(s.name, type, desc, freq, date, amount);
}

/* ───────────────────────── util ───────────────────────── */
function esc(s) { return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

loadDashboard();
</script>
